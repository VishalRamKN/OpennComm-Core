# SPDX-License-Identifier: GPL-3.0-or-later
#
# Most of this is deliberately not a full build. Building the application needs
# Qt 6.4, OpenCV, a compiled llama.cpp and whisper.cpp, and the fetch scripts
# download about 1.3 GB of model weights -- none of which belongs on a runner
# for every push. What runs on every push is everything that can be checked in
# seconds and that would otherwise only be caught by a person.
#
# The one exception is `windows-app`, which does build and install the whole
# thing. It exists because the Windows port cannot be checked any other way:
# there is no Windows machine in the loop the rest of the time, and a port that
# is never compiled is a port that does not work. It is kept off the every-push
# path by running only on main, on release tags, and on demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build

      # core/ is pure C with no I/O and no dependency beyond libm, and it holds
      # every rule that decides what a patient is understood to have said. It
      # configures standalone precisely so this job needs no camera, no model,
      # no window and no Qt. If this step ever starts needing one of those, the
      # change belongs somewhere other than core/.
      - name: Configure, build and test core standalone
        run: |
          cmake -S core -B build-core -G Ninja
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Parse every script
        run: |
          for f in scripts/*.sh run.sh packaging/AppRun; do
            echo "== $f"
            bash -n "$f"
          done

      # The PowerShell scripts get the same treatment as the shell ones. A
      # syntax error in fetch-deps.ps1 would otherwise only surface on a
      # Windows machine, halfway through a 1.3 GB download.
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1)) {
            Write-Host "== $($f.FullName)"
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
                $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "   $_" }; $bad = $true }
          }
          if ($bad) { exit 1 }

      # Advisory: these scripts do deliberate things shellcheck dislikes, so a
      # finding is a prompt to look rather than a failure. Errors still fail.
      - name: shellcheck
        run: shellcheck -S error scripts/*.sh run.sh || exit 1

      - name: shellcheck (warnings, advisory)
        continue-on-error: true
        run: shellcheck -S warning scripts/*.sh run.sh

  metadata:
    name: desktop and AppStream metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get update -qq && sudo apt-get install -y -qq appstream desktop-file-utils

      # An AppStream id has to match the .desktop file that launches it, and a
      # mismatch fails no build: it produces an application that installs fine
      # and appears in GNOME Software with no icon and no description.
      - name: Validate metainfo and desktop entry
        run: |
          appstreamcli validate packaging/*.metainfo.xml
          desktop-file-validate packaging/*.desktop

      # The metainfo <releases> version is what software centres display, and
      # it is not the version the package is built with. They drift silently.
      - name: VERSION agrees with the metainfo release
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          meta=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' packaging/*.metainfo.xml | head -1)
          echo "VERSION=$version metainfo=$meta"
          test "$version" = "$meta"

      - name: Icon name matches the component id
        run: |
          id=$(basename packaging/*.metainfo.xml .metainfo.xml)
          grep -qx "Icon=$id" "packaging/$id.desktop"
          test -f "packaging/$id.png" && test -f "packaging/$id.svg"

  windows-core:
    name: core tests (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The same standalone core/ build the Linux job does, through a compiler
      # that disagrees with GCC about almost every warning flag and has no
      # libm to link against. It is fast, it needs no models and no Qt, and it
      # is what catches a change to core/ that only compiles on Linux -- which
      # is the failure mode that would otherwise reach a Windows user as a
      # release that could not be built at all.
      #
      # Three steps rather than one `run:` block with three lines. On Windows a
      # `run:` block is PowerShell, and PowerShell does not stop when a native
      # command fails -- only the last command's exit code reaches the runner.
      # Written as one block, a configure error is invisible and the job
      # reports a confusing test failure instead of the thing that broke.
      #
      # No generator is named. The default on this runner is Visual Studio,
      # which is multi-config: that is why --config and -C appear below, and
      # why nothing here needs Ninja to be installed. core/ is nine C files;
      # which generator builds them is not what this job is testing.
      - name: Configure core standalone
        run: cmake -S core -B build-core

      - name: Build core standalone
        run: cmake --build build-core --config Release

      # -C Release is not optional with a multi-config generator. Without it
      # ctest has no configuration to substitute into the test paths, looks for
      # the executables in a directory that was never built, and reports all
      # seven suites as "Not Run" -- which reads like a test failure and is not.
      - name: Test core standalone
        run: ctest --test-dir build-core -C Release --output-on-failure

  windows-app:
    name: windows build and install
    runs-on: windows-latest
    # Not on every pull request. It downloads 1.3 GB of weights and compiles
    # llama.cpp and whisper.cpp from source; the cache makes the repeat runs
    # quick but the first one is not. On main, on a release tag, and on demand
    # is where it earns its time.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Installed explicitly rather than assumed. scripts/fetch-deps.ps1 asks
      # for ninja by name, and llama.cpp and whisper.cpp are built
      # single-config on purpose so their .dll and .lib land somewhere
      # predictable -- see cmake/deps.cmake. Visual Studio ships a copy of
      # Ninja, but whether it reaches PATH depends on the developer-prompt
      # action, and a dependency that is only sometimes there is worse than one
      # that is installed.
      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # Multimedia as well as the defaults: src/audio.cc uses QAudioSource and
      # QAudioSink to reach the microphone and the speaker, which on Linux are
      # ffmpeg and paplay instead. See src/audio.h.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      # The official prebuilt OpenCV, not a vcpkg source build: this needs
      # core, videoio and imgproc only, and building all of OpenCV from source
      # would cost more runner time than everything else here put together.
      - name: Install OpenCV
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL -o opencv.exe https://github.com/opencv/opencv/releases/download/4.11.0/opencv-4.11.0-windows.exe
          if ($LASTEXITCODE -ne 0) { throw "downloading OpenCV failed" }
          Start-Process -FilePath .\opencv.exe -ArgumentList "-o`"$env:RUNNER_TEMP`" -y" -Wait
          $cv = "$env:RUNNER_TEMP\opencv\build"
          if (-not (Test-Path "$cv\OpenCVConfig.cmake")) { throw "OpenCV did not extract to $cv" }

          # Printed, not assumed. Which vcNN directory the Windows pack carries
          # changes between OpenCV releases, and naming one it does not ship
          # fails identically to naming none -- "no binaries compatible with
          # your configuration", an hour into the job. The root CMakeLists
          # probes for it; this is here so that when the probe finds nothing,
          # the log says what was actually on disk instead of leaving the next
          # person to guess again.
          Write-Host "OpenCV pack carries:"
          Get-ChildItem "$cv\x64" -Directory | ForEach-Object { Write-Host "  x64\$($_.Name)" }

          $rt = Get-ChildItem "$cv\x64" -Directory |
                Where-Object { Test-Path "$($_.FullName)\bin" } |
                Sort-Object Name -Descending | Select-Object -First 1
          if (-not $rt) { throw "no x64\vcNN\bin directory in the OpenCV pack at $cv" }
          Write-Host "using $($rt.Name)"

          "OpenCV_DIR=$cv" >> $env:GITHUB_ENV
          "$($rt.FullName)\bin" >> $env:GITHUB_PATH

      - name: Install sqlite3
        run: vcpkg install sqlite3:x64-windows

      # The models and the compiled runtimes, keyed on the scripts that pin
      # them: a checksum or a tag changing in fetch-deps.ps1 is exactly when
      # this cache must not be reused.
      - name: Cache models and built dependencies
        uses: actions/cache@v4
        with:
          path: |
            models
            third_party
          key: win-deps-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Fetch and build dependencies
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1

      # Separate steps, for the reason given in windows-core above: a PowerShell
      # `run:` block does not stop at the first failing command, so a configure
      # error would surface as a compile error further down.
      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }};C:\vcpkg\installed\x64-windows
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-windows --target openncomm

      # Installed rather than packaged. The install rules and windeployqt are
      # what decide whether the application can start at all on a machine that
      # is not this one; NSIS compressing 1.4 GB afterwards proves nothing
      # further and takes twenty minutes to do it. The installer itself is
      # built at release time by scripts/build-windows.ps1.
      - name: Install into a staging tree
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }};C:\vcpkg\installed\x64-windows
        run: cmake --install build-windows --prefix "${{ runner.temp }}\staged"

      - name: Verify the staged tree is complete
        run: powershell -ExecutionPolicy Bypass -File scripts\verify-windows-tree.ps1 -Tree "${{ runner.temp }}\staged"

      # Starting it proves the DLLs resolve -- the failure this whole job
      # exists to catch is a tree that installs and then cannot load Qt, or
      # MediaPipe, or the platform plugin. There is no camera and no display on
      # a runner, so --version is as far as it can go, and that is far enough:
      # it is past every library load.
      - name: Start the application
        run: |
          & "${{ runner.temp }}\staged\openncomm.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "openncomm.exe --version exited $LASTEXITCODE" }
